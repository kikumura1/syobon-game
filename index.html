      padding: 10px;

    }

    canvas {

      border-radius: 8px;
      display: block;
      margin: 10px auto;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      max-width: 100%;
      height: auto;
    }
    .info-bar {

      justify-content: center;
      gap: 15px;

      padding: 8px 15px;

      font-size: 14px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }
    .controls {

      gap: 15px;
      margin-top: 5px;
    }
    .btn {
      width: 80px;
      height: 55px;
      font-size: 20px;
      font-weight: bold;
      background-color: #333;
      color: white;
      border: 2px solid #555;
      border-radius: 8px;
      cursor: pointer;
      touch-action: none;
    }
    .btn:active { background-color: #666; }

    /* スマホ画面固定タッチコントローラー */
    #touch-controls {
      position: fixed;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 9999;
      pointer-events: none;
    }
    .touch-btn {
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);

    .touch-btn:active {

      transform: scale(0.95);

    }

    function initStage() {
      cameraX = 0;
      loadStageData(currentStage);
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (['arrowleft', 'a', 'j'].includes(k)) keys.left = true;
      if (['arrowright', 'd', 'l'].includes(k)) keys.right = true;
      if (['arrowup', 'w', 'k'].includes(k)) keys.jump = true;

      if (e.key === ' ' || e.code === 'Space') {
        currentStage = (currentStage % 4) + 1;
        respawnPoint = { x: 30, y: 280 };
        resetGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (['arrowleft', 'a', 'j'].includes(k)) keys.left = false;
      if (['arrowright', 'd', 'l'].includes(k)) keys.right = false;
      if (['arrowup', 'w', 'k'].includes(k)) keys.jump = false;
    });

    const setupBtn = (id, key) => {
      const b = document.getElementById(id);
      if (!b) return;
      const pressStart = (e) => { e.preventDefault(); keys[key] = true; };
      const pressEnd = (e) => { e.preventDefault(); keys[key] = false; };
      b.addEventListener('mousedown', pressStart);
      b.addEventListener('mouseup', pressEnd);
      b.addEventListener('mouseleave', pressEnd);
      b.addEventListener('touchstart', pressStart);
      b.addEventListener('touchend', pressEnd);
      b.addEventListener('touchcancel', pressEnd);
    };

    setupBtn('btn-left', 'left');
    setupBtn('btn-right', 'right');
    setupBtn('btn-jump', 'jump');

    setupBtn('tbtn-left', 'left');
    setupBtn('tbtn-right', 'right');
    setupBtn('tbtn-jump', 'jump');

    function die(msg) {
      deaths++;
      document.getElementById('death-count').textContent = deaths;
      alert(`【失敗】${msg || 'やり直し！'}`);
      resetGame();
    }

    function resetGame() {
      keys.left = false;
      keys.right = false;
      keys.jump = false;
      player.x = respawnPoint.x;
      player.y = respawnPoint.y;
      player.vx = 0;
      player.vy = 0;
      initStage();
    }

    function update() {
      if (keys.left) {
        player.vx = -player.speed;
        player.facingRight = false;
      } else if (keys.right) {
        player.vx = player.speed;
        player.facingRight = true;
      } else {
        player.vx = 0;
      }

      if (keys.jump && player.isGrounded) {
        player.vy = player.jumpPower;
        player.isGrounded = false;
      }

      player.vy += gravity;
      player.x += player.vx;
      player.y += player.vy;

      if (player.x < 0) player.x = 0;

      const progress = Math.min(100, Math.floor((player.x / STAGE_WIDTH) * 100));
      document.getElementById('progress-val').textContent = progress;
      
      document.getElementById('x-pos').textContent = Math.floor(player.x);
      document.getElementById('y-pos').textContent = Math.floor(player.y);

      cameraX = player.x - canvas.width / 2 + player.width / 2;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > STAGE_WIDTH - canvas.width) cameraX = STAGE_WIDTH - canvas.width;

      player.isGrounded = false;

      // 移動床
      movingPlatforms.forEach(mp => {
        mp.x += mp.vx;
        if (mp.x <= mp.minX || mp.x + mp.width >= mp.maxX) mp.vx *= -1;

        if (
          player.x < mp.x + mp.width && player.x + player.width > mp.x &&
          player.y + player.height >= mp.y && player.y + player.height <= mp.y + mp.height + 12 &&
          player.vy >= 0
        ) {
          player.y = mp.y - player.height;
          player.vy = 0;
          player.isGrounded = true;
          player.x += mp.vx;
        }
      });

      // 固定床・天井・落下床
      platforms.forEach(p => {
        if (p.broken) return;

        if (p.type === 'ceiling' && player.x > p.x - 50) p.fall = true;
        if (p.fall) {
          p.vy += 0.35;
          p.y += p.vy;
          if (
            player.x < p.x + p.width && player.x + player.width > p.x &&
            player.y < p.y + p.height && player.y + player.height > p.y
          ) {
            die('天井が落ちてきた！');
          }
        }

        if (
          player.x < p.x + p.width && player.x + player.width > p.x &&
          player.y + player.height >= p.y && player.y + player.height <= p.y + p.height + 12 &&
          player.vy >= 0
        ) {
          player.y = p.y - player.height;
          player.vy = 0;
          player.isGrounded = true;

          if (p.type === 'fall') {
            if (p.delay > 0) p.delay--;
            else p.broken = true;
          }
        }
      });

      // 隠しブロック
      hiddenBlocks.forEach(b => {
        if (
          player.x < b.x + b.width && player.x + player.width > b.x &&
          player.y <= b.y + b.height && player.y >= b.y && player.vy < 0
        ) {
          b.revealed = true;
          player.vy = 2;
        }
        if (b.revealed && player.x < b.x + b.width && player.x + player.width > b.x &&
            player.y + player.height >= b.y && player.y + player.height <= b.y + b.height && player.vy >= 0) {
          player.y = b.y - player.height;
          player.vy = 0;
          player.isGrounded = true;
        }
      });

      // スターコイン
      starCoins.forEach(coin => {
        if (coin.collected) return;
        const dx = (player.x + player.width / 2) - coin.x;
        const dy = (player.y + player.height / 2) - coin.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < coin.radius + player.width / 2) {
          coin.collected = true;
          coinsCollected++;
          document.getElementById('coin-count').textContent = coinsCollected;
        }
      });

      // トゲ
      spikes.forEach(s => {
        if (player.x > s.x - 90) s.triggered = true;
        if (s.triggered) {
          s.vy += 0.4;
          s.y += s.vy;
        }
        if (
          player.x < s.x + s.width && player.x + player.width > s.x &&
          player.y < s.y + s.height && player.y + player.height > s.y
        ) {
          die('トゲに当たった！');
        }
      });

      // 通常敵
      enemies.forEach(e => {
        if (!e.alive) return;

        e.x += e.vx;
        if (e.x <= e.minX || e.x + e.width >= e.maxX) e.vx *= -1;

        if (
          player.x < e.x + e.width && player.x + player.width > e.x &&
          player.y < e.y + e.height && player.y + player.height > e.y
        ) {
          if (player.vy > 0 && player.y + player.height <= e.y + e.height / 2 + player.vy) {
            e.alive = false;
            player.vy = -8;
          } else {
            die('敵にぶつかった！');
          }
        }
      });

      // 中間旗
      flags.forEach(f => {
        if (
          player.x < f.x + f.width && player.x + player.width > f.x &&
          player.y < f.y + f.height && player.y + player.height > f.y
        ) {
          if (f.type === 'trap') {
            die('トラップ旗に触れて爆発した！');
          } else if (f.type === 'real' && !f.activated) {
            f.activated = true;
            respawnPoint = { x: f.x, y: f.y - 10 };
          }
        }
      });

      // ゴール判定
      goals.forEach(g => {
        if (!g.active) return;
        if (player.x + player.width >= g.x && player.x <= g.x + g.width) {
          if (g.type === 'real') {
            if (currentStage < 4) {
              alert(`🎉 STAGE 1-${currentStage} クリア！\n次のステージに進みます！`);
              currentStage++;
              respawnPoint = { x: 30, y: 280 };
              resetGame();
            } else {
              alert(`🏆🏆🏆 全4ステージ完全走破！！おめでとうございます！！\n総獲得コイン: ${coinsCollected} 枚\n総死亡回数: ${deaths} 回`);
              currentStage = 1;
              deaths = 0;
              coinsCollected = 0;
              document.getElementById('coin-count').textContent = 0;
              respawnPoint = { x: 30, y: 280 };
              resetGame();
            }
          }
        }
      });

      if (player.y > canvas.height + 50) die('穴に落ちた！');

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-cameraX, 0);

      // トゲ予兆線
      spikes.forEach(s => {
        ctx.strokeStyle = 'rgba(233, 30, 99, 0.2)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(s.x + s.width / 2, s.y);
        ctx.lineTo(s.x + s.width / 2, 340);
        ctx.stroke();
        ctx.setLineDash([]);
      });

      // 床
      platforms.forEach(p => {
        if (p.broken) return;
        ctx.fillStyle = p.type === 'ceiling' ? '#444' : (p.type === 'fall' ? '#a5442a' : (currentStage === 1 ? '#5c3a21' : (currentStage === 2 ? '#2d3250' : (currentStage === 3 ? '#4a1525' : '#220033'))));
        ctx.fillRect(p.x, p.y, p.width, p.height);
        if (p.type === 'normal') {
          ctx.fillStyle = currentStage === 1 ? '#388e3c' : (currentStage === 2 ? '#415a77' : (currentStage === 3 ? '#d32f2f' : '#8800cc'));
          ctx.fillRect(p.x, p.y, p.width, 6);
        }
      });

      // 移動リフト
      movingPlatforms.forEach(mp => {
        ctx.fillStyle = '#00bcd4';
        ctx.fillRect(mp.x, mp.y, mp.width, mp.height);
        ctx.fillStyle = '#e0f7fa';
        ctx.fillRect(mp.x, mp.y, mp.width, 3);
      });

      // 隠しブロック
      hiddenBlocks.forEach(b => {
        if (b.revealed) {
          ctx.fillStyle = '#ff9800';
          ctx.fillRect(b.x, b.y, b.width, b.height);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 16px sans-serif';
          ctx.fillText('?', b.x + 9, b.y + 22);
        } else {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.strokeRect(b.x, b.y, b.width, b.height);
        }
      });

      // スターコイン
      starCoins.forEach(coin => {
        if (coin.collected) return;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#FF8C00';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('★', coin.x - 6, coin.y + 4);
      });

      // トゲ
      spikes.forEach(s => {
        ctx.fillStyle = '#e91e63';
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + s.width / 2, s.y + s.height);
        ctx.lineTo(s.x + s.width, s.y);
        ctx.closePath();
        ctx.fill();
      });

      // 通常敵
      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = '#d32f2f';
        ctx.fillRect(e.x, e.y, e.width, e.height);
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x + 4, e.y + 6, 5, 8);
        ctx.fillRect(e.x + 19, e.y + 6, 5, 8);
        ctx.fillStyle = '#000';
        ctx.fillRect(e.x + 6, e.y + 8, 3, 4);
        ctx.fillRect(e.x + 21, e.y + 8, 3, 4);
      });

      // 中間旗
      flags.forEach(f => {
        ctx.fillStyle = '#aaa';
        ctx.fillRect(f.x, f.y, 4, f.height);
        ctx.fillStyle = f.type === 'trap' ? '#ff1744' : (f.activated ? '#00e676' : '#29b6f6');
        ctx.beginPath();
        ctx.moveTo(f.x + 4, f.y);
        ctx.lineTo(f.x + 24, f.y + 12);
        ctx.lineTo(f.x + 4, f.y + 24);
        ctx.closePath();
        ctx.fill();
      });

      // ゴール
      goals.forEach(g => {
        if (!g.active) return;
        ctx.fillStyle = '#fff';
        ctx.fillRect(g.x, g.y, g.width, g.height);
        ctx.fillStyle = '#4caf50';
        ctx.beginPath();
        ctx.arc(g.x + 5, g.y, 12, 0, Math.PI * 2);
        ctx.fill();
      });

      // プレイヤー
      const px = player.x;
      const py = player.y;

      ctx.fillStyle = '#d32f2f';
      ctx.fillRect(px + 4, py + 16, 18, 10);
      ctx.fillStyle = '#1976d2';
      ctx.fillRect(px + 6, py + 22, 14, 8);

      ctx.fillStyle = '#424242';
      ctx.fillRect(px + 2, py + 30, 8, 6);
      ctx.fillRect(px + 16, py + 30, 8, 6);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(px + 13, py + 10, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#000';
      const eyeOffset = player.facingRight ? 2 : -2;

      ctx.fillRect(px + 8 + eyeOffset, py + 8, 3, 4);
      ctx.fillRect(px + 15 + eyeOffset, py + 8, 3, 4);

      ctx.beginPath();
      ctx.arc(px + 11 + eyeOffset, py + 14, 2, 0, Math.PI);
      ctx.arc(px + 15 + eyeOffset, py + 14, 2, 0, Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    initStage();
    update();
  </script>

</body>
